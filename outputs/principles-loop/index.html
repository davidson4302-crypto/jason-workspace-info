<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Principles Loop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500;600&display=block" rel="stylesheet">
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
<style>
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #F4F2EE; }
  body { display: grid; place-items: center; overflow: hidden; }
  #film { display: block; width: min(100vw, 100vh); height: min(100vw, 100vh); cursor: pointer; }
  body.render #film { width: 1080px; height: 1080px; cursor: default; }
</style>
</head>
<body>
<canvas id="film" width="1080" height="1080"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// =====================================================================================
// Animation-principles loop. 1080x1080, 8 s, 60 fps, 480 frames; frame 480 == frame 0.
// window.renderAt(t) paints any frame from t alone. All randomness is seeded.
// window.renderAudio() synthesizes the score (Web Audio, offline) and returns a WAV.
// =====================================================================================

const W = 1080, H = 1080, FPS = 60, N = 480, LOOP_S = N / FPS;
const params = new URLSearchParams(location.search);
const RENDER = params.has('render');
if (RENDER) document.body.classList.add('render');

const HEX = {
  orange: 0xD97757, accent: 0xFF6A2B, ink: 0x0F0F0F, cell: 0xEFEEEA,
  backdrop: 0xF4F2EE, gray: 0x8E8A83, white: 0xFFFFFF,
};
const CSS = { orange: '#D97757', accent: '#FF6A2B', ink: '#0F0F0F', gray: '#8E8A83' };

// ---------- math ----------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInQuad = (t) => t * t;
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const wrap = (f) => ((f % N) + N) % N;
const rad = THREE.MathUtils.degToRad;
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Damped spring released from a displacement at rest (step response, zero initial velocity).
function springStep(tau, zeta, hz) {
  if (tau <= 0) return 1;
  const w = 2 * Math.PI * hz, s = Math.sqrt(1 - zeta * zeta), wd = w * s;
  return Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + (zeta / s) * Math.sin(wd * tau));
}

// ---------- the timeline (all in frames) ----------
const DIAMOND_X = [-4, -2, 0, 2, 4];
const RULER_X0 = -5.5;                 // ruler frame 0; 30 frames per unit
const TRACK_Z = [-0.82, 0, 0.82];
const GROUND = 0.09;                   // top face of a keyframe diamond
const COM = 0.65;                      // mascot centre above its feet
const SHOULDER = 0.7;                  // shoulder height above the feet
const STRETCH = [0.85, 1.28];          // takeoff stretch (x, y)
const JUMPS = [
  { C: 69,  T: 80,  L: 105, x0: -4, x1: -2, h: 1.1, d: 1, crouch: [1.2, 0.75], land: [1.25, 0.70] },
  { C: 129, T: 140, L: 165, x0: -2, x1: 0,  h: 1.1, d: 2, crouch: [1.2, 0.75], land: [1.25, 0.70] },
  { C: 189, T: 200, L: 225, x0: 0,  x1: 2,  h: 1.1, d: 3, crouch: [1.2, 0.75], land: [1.25, 0.70] },
  { C: 249, T: 260, L: 285, x0: 2,  x1: 4,  h: 1.1, d: 4, crouch: [1.2, 0.75], land: [1.25, 0.70] },
  { C: 312, T: 330, L: 384, x0: 4,  x1: -4, h: 3.5, d: 0, crouch: [1.32, 0.6], land: [1.3, 0.64], flip: true },
];
const LIGHT_ON = { key: 6, rim: 24, top: 42 };
const LIGHTS_OFF = 468;
const FLICKER = [1.0, 0.08, 0.6];      // the 3-frame click-on flicker
const LABEL_FRAMES = [69, 140, 200, 285, 303];
const ARC_F0 = 303, ARC_DOTS = 16, ARC_LIFT = 0.95;
const BLINK = 432;
const BODY_SPRING = { zeta: 0.55, hz: 3.2 };
const ARM_SPRING = { zeta: 0.22, hz: 2.2 };
const LEG_SPRING = { zeta: 0.45, hz: 2.8 };
const ARM_LAG = 4, LEG_LAG = 6;

function lightLevel(on, f) {
  if (f < on || f >= LIGHTS_OFF) return 0;
  const i = Math.floor(f - on + 1e-6);
  return i < FLICKER.length ? FLICKER[i] : 1;
}

// ---------- body: squash, stretch, arcs ----------
function body(fIn) {
  const f = wrap(fIn);
  let J = null;
  for (const j of JUMPS) if (f >= j.C) J = j;
  let ff = f;
  if (!J) { J = JUMPS[JUMPS.length - 1]; ff = f + N; }       // flip's landing tail from the previous loop
  const dir = Math.sign(J.x1 - J.x0);
  const kc = (J.crouch[0] - 1) / (J.crouch[1] - 1);
  const ks = (STRETCH[0] - 1) / (STRETCH[1] - 1);
  const kl = (J.land[0] - 1) / (J.land[1] - 1);
  const air = J.L - J.T;
  let x = J.x0, lift = 0, sy = 1, k = kc, rot = 0, lean = 0, phase = 'rest';
  if (ff < J.T - 2) {                                          // anticipation
    const u = (ff - J.C) / (J.T - 2 - J.C);
    sy = 1 - (1 - J.crouch[1]) * sstep(0, 1, u); k = kc; phase = 'crouch';
    if (!J.flip) lean = dir * 0.05 * sstep(0, 1, u);           // sit back before the push
  } else if (ff < J.T) {                                       // snap into the stretch
    const u = (ff - (J.T - 2)) / 2;
    sy = lerp(J.crouch[1], STRETCH[1], easeInQuad(u)); k = sy < 1 ? kc : ks; phase = 'push';
    if (!J.flip) lean = dir * lerp(0.05, -0.11, u);
  } else if (ff < J.L) {                                       // ballistic arc
    const u = (ff - J.T) / air;
    lift = 4 * J.h * u * (1 - u);
    x = lerp(J.x0, J.x1, u);
    const relax = air * 0.45;
    if (ff < J.T + relax) sy = lerp(STRETCH[1], 1, easeOutCubic((ff - J.T) / relax));
    else if (ff < J.L - 6) sy = 1;
    else if (ff < J.L - 1) sy = lerp(1, 1.08, easeInQuad((ff - (J.L - 6)) / 5));
    else sy = lerp(1.08, J.land[1], ff - (J.L - 1));
    k = sy < 1 ? kl : ks; phase = 'air';
    if (J.flip) rot = 2 * Math.PI * easeInOutCubic(clamp((ff - J.T - 1) / (air - 7)));
    else lean = -dir * (0.11 * (1 - u) * (1 - u) - 0.07 * u * u);
  } else {                                                     // land, spring back
    const tau = (ff - J.L) / FPS;
    sy = 1 + (J.land[1] - 1) * springStep(tau, BODY_SPRING.zeta, BODY_SPRING.hz);
    k = sy < 1 ? kl : ks; x = J.x1; phase = 'land';
    if (!J.flip) lean = dir * 0.07 * springStep(tau, 0.5, 2.5);
  }
  return { x, lift, sx: 1 + (sy - 1) * k, sy, rot, lean, J, phase };
}

// ---------- secondary motion tables (precomputed once, read by time) ----------
const SUB = 8, NS = N * SUB;
const TAB = { arm: new Float32Array(NS), leg: new Float32Array(NS), camX: new Float32Array(NS) };
(function simulate() {
  const dt = 1 / (FPS * SUB);
  const sh = new Float64Array(NS), px = new Float64Array(NS);
  for (let n = 0; n < NS; n++) {
    const b = body(n / SUB);
    sh[n] = GROUND + b.lift + SHOULDER * b.sy;
    px[n] = b.x;
  }
  const acc = (a, n) => { n = ((n % NS) + NS) % NS; return (a[(n + 1) % NS] - 2 * a[n] + a[(n - 1 + NS) % NS]) / (dt * dt); };
  const wA = 2 * Math.PI * ARM_SPRING.hz, zA = ARM_SPRING.zeta;
  const wL = 2 * Math.PI * LEG_SPRING.hz, zL = LEG_SPRING.zeta;
  const wC = 2 * Math.PI * 0.55;
  const K_ARM = 0.95, K_LEG = 0.11;
  let th = 0, thv = 0, lg = 0, lgv = 0, cx = -4, cv = 0;
  for (let loop = 0; loop < 3; loop++) {
    for (let n = 0; n < NS; n++) {
      thv += (-wA * wA * th - 2 * zA * wA * thv - K_ARM * acc(sh, n - ARM_LAG * SUB)) * dt; th += thv * dt;
      lgv += (-wL * wL * lg - 2 * zL * wL * lgv - K_LEG * acc(px, n - LEG_LAG * SUB)) * dt; lg += lgv * dt;
      cv += (wC * wC * (px[n] - cx) - 2 * wC * cv) * dt; cx += cv * dt;
      if (loop === 2) { TAB.arm[n] = th; TAB.leg[n] = lg; TAB.camX[n] = cx; }
    }
  }
})();
function tab(arr, f) {
  const p = wrap(f) * SUB, i = Math.floor(p), u = p - i;
  return lerp(arr[i % NS], arr[(i + 1) % NS], u);
}

// ---------- renderer, scene, camera ----------
const canvas = document.getElementById('film');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1);
renderer.setSize(W, H, false);
renderer.toneMapping = THREE.NoToneMapping;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap;
renderer.shadowMap.autoUpdate = false;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(18, W / H, 4, 160);

// Colour temperature -> linear RGB with unit luminance, tempered toward neutral for the grade.
function kelvin(K, strength = 1) {
  const t = K / 100;
  let r, g, b;
  if (t <= 66) {
    r = 255; g = 99.4708025861 * Math.log(t) - 161.1195681661;
    b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307;
  } else {
    r = 329.698727446 * Math.pow(t - 60, -0.1332047592);
    g = 288.1221695283 * Math.pow(t - 60, -0.0755148492); b = 255;
  }
  const c = new THREE.Color().setRGB(clamp(r / 255), clamp(g / 255), clamp(b / 255), THREE.SRGBColorSpace);
  c.lerp(new THREE.Color(1, 1, 1), 1 - strength);
  const lum = 0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b;
  return c.multiplyScalar(1 / lum);
}
const TEMP = { key: kelvin(3200, 0.3), rim: kelvin(7500, 0.8), top: kelvin(5000, 0.6) };

// ---------- materials ----------
const M = {
  backdrop: new THREE.MeshStandardMaterial({ color: HEX.backdrop, roughness: 1 }),
  slab: new THREE.MeshStandardMaterial({ color: HEX.white, roughness: 0.55 }),
  cell: new THREE.MeshStandardMaterial({ color: HEX.cell, roughness: 0.7 }),
  inkFlat: new THREE.MeshStandardMaterial({ color: HEX.ink, roughness: 0.5, flatShading: true }),
  body: new THREE.MeshPhysicalMaterial({ color: HEX.orange, roughness: 0.45, clearcoat: 0.3, clearcoatRoughness: 0.3 }),
  eye: new THREE.MeshPhysicalMaterial({ color: HEX.ink, roughness: 0.3, clearcoat: 0.8, clearcoatRoughness: 0.15 }),
  stand: new THREE.MeshStandardMaterial({ color: 0x2b2927, roughness: 0.55, metalness: 0.25 }),
  metal: new THREE.MeshStandardMaterial({ color: 0x9b9893, roughness: 0.32, metalness: 0.85 }),
  rubber: new THREE.MeshStandardMaterial({ color: 0x1a1918, roughness: 0.9 }),
  playhead: new THREE.MeshStandardMaterial({ color: HEX.accent, roughness: 0.4, emissive: HEX.accent, emissiveIntensity: 0 }),
  arcDot: new THREE.MeshStandardMaterial({ color: HEX.accent, roughness: 0.4, emissive: HEX.accent, emissiveIntensity: 1.1 }),
  spark: new THREE.MeshBasicMaterial({ color: HEX.accent }),
};
const panelMat = (temp) => new THREE.MeshStandardMaterial({ color: 0xd8d5cf, roughness: 0.9, emissive: temp.clone(), emissiveIntensity: 0 });
M.keyPanel = panelMat(TEMP.key);
M.rimPanel = panelMat(TEMP.rim);
M.topLens = panelMat(TEMP.top);
M.topRim = new THREE.MeshStandardMaterial({ color: 0x3a3836, roughness: 0.4, metalness: 0.5, emissive: TEMP.top.clone(), emissiveIntensity: 0 });

// ---------- backdrop + floating slab ----------
// The backdrop is graded rather than lit: its level follows the lights (lights-off near 50%), it carries a soft
// falloff and the floating slab's shadow, and the final pass dithers it.
const FLOOR_Y = -1.9;
const backdropMat = new THREE.ShaderMaterial({
  uniforms: { uColor: { value: new THREE.Color() } },
  vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
  fragmentShader: `
    uniform vec3 uColor; varying vec3 vW;
    float box(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
    void main(){
      float pool = 1.0 - 0.16 * smoothstep(4.0, 30.0, length((vW.xz - vec2(0.0, -3.0)) * vec2(0.8, 1.0)));
      float d = box(vW.xz - vec2(-0.3, 1.25), vec2(5.9, 2.9), 0.8);
      float shade = 1.0 - 0.46 * (1.0 - smoothstep(-1.6, 3.4, d));
      gl_FragColor = vec4(uColor * pool * shade, 1.0);
    }`,
});
const floor = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), backdropMat);
floor.rotation.x = -Math.PI / 2; floor.position.y = FLOOR_Y;
scene.add(floor);
const BACKDROP_LIN = new THREE.Color(HEX.backdrop);   // linear F4F2EE

const slab = new THREE.Mesh(new RoundedBoxGeometry(12, 0.5, 6, 3, 0.07), M.slab);
slab.position.y = -0.25; slab.receiveShadow = true;
scene.add(slab);

// ---------- timeline on the slab top ----------
const CELL_PITCH = 0.25, CELLS = 44;
const cellGeo = new RoundedBoxGeometry(0.222, 0.04, 0.68, 1, 0.012);
const cells = new THREE.InstancedMesh(cellGeo, M.cell, CELLS * TRACK_Z.length);
cells.receiveShadow = true;
const cellPos = [];
for (let t = 0; t < TRACK_Z.length; t++) {
  for (let i = 0; i < CELLS; i++) cellPos.push([RULER_X0 + CELL_PITCH * (i + 0.5), TRACK_Z[t]]);
}
scene.add(cells);

function ripple(x, z, f) {
  let h = 0;
  for (const J of JUMPS) {
    let tau = (f - J.L) / FPS;
    if (tau < 0) tau += LOOP_S;
    if (tau > 1.5) continue;
    const r = Math.hypot(x - J.x1, z);
    const front = 0.55 + (J.flip ? 7.5 : 6.0) * tau;
    const amp = 0.08 * sstep(0, 0.03, tau) * Math.exp(-Math.max(0, tau - 0.03) / (J.flip ? 0.6 : 0.45));
    h += amp * Math.exp(-(((r - front) / 0.38) ** 2));
  }
  return Math.min(h, 0.08);
}

// Ruler with frame numbers. Glyphs are drawn 2x tall so they read upright from the 30 degree camera.
const RULER = { x0: -5.62, x1: 5.62, z0: -2.07, z1: -1.2, ppu: 400 };
function rulerTexture() {
  const w = Math.round((RULER.x1 - RULER.x0) * RULER.ppu), h = Math.round((RULER.z1 - RULER.z0) * RULER.ppu);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const g = c.getContext('2d');
  const X = (x) => (x - RULER.x0) * RULER.ppu, Z = (z) => (z - RULER.z0) * RULER.ppu;
  g.clearRect(0, 0, w, h);
  g.fillStyle = CSS.gray;
  g.fillRect(X(RULER_X0), Z(-1.255), (11) * RULER.ppu, 0.012 * RULER.ppu);   // baseline
  for (let i = 0; i <= 44; i++) {
    const x = RULER_X0 + i * CELL_PITCH, major = i % 4 === 0;
    const len = major ? 0.2 : 0.09, wdt = major ? 0.022 : 0.014;
    g.fillRect(X(x) - (wdt * RULER.ppu) / 2, Z(-1.255) - len * RULER.ppu, wdt * RULER.ppu, len * RULER.ppu);
  }
  g.fillStyle = CSS.ink; g.globalAlpha = 0.78;
  g.textAlign = 'center'; g.textBaseline = 'alphabetic';
  const em = 0.38 * RULER.ppu;
  g.font = `500 ${em}px "Geist Mono"`;
  for (let i = 0; i <= 11; i++) {
    const x = RULER_X0 + i;
    g.save(); g.translate(X(x), Z(-1.5)); g.scale(1, 2); g.fillText(String(i * 30), 0, 0); g.restore();
  }
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = MAX_ANISO;
  return t;
}
let ruler;

// Keyframe diamonds: white fill on a 0F0F0F outline.
const diamonds = DIAMOND_X.map((x) => {
  const g = new THREE.Group(); g.position.set(x, 0.04, 0);
  const outline = new THREE.Mesh(new THREE.CylinderGeometry(0.37, 0.37, 0.044, 4), M.inkFlat);
  outline.position.y = 0.022;
  const fillMat = new THREE.MeshStandardMaterial({ color: HEX.white, roughness: 0.45, emissive: HEX.accent, emissiveIntensity: 0, flatShading: true });
  const fill = new THREE.Mesh(new THREE.CylinderGeometry(0.305, 0.305, 0.05, 4), fillMat);
  fill.position.y = 0.025;
  fill.receiveShadow = true; outline.receiveShadow = true;
  g.add(outline, fill);
  const glow = new THREE.PointLight(HEX.accent, 0, 1.6, 2);
  glow.position.set(x, 0.24, 0.14);
  scene.add(glow);
  scene.add(g);
  return { g, fillMat, glow, x };
});

// Playhead: head on the ruler, line under the diamonds, light at the track's front edge.
const playhead = new THREE.Group();
{
  const line = new THREE.Mesh(new THREE.BoxGeometry(0.034, 0.008, 2.52), M.playhead);
  line.position.set(0, 0.048, -0.02);
  const shape = new THREE.Shape();
  shape.moveTo(-0.13, -0.17); shape.lineTo(0.13, -0.17); shape.lineTo(0.13, 0.06); shape.lineTo(0, 0.17); shape.lineTo(-0.13, 0.06); shape.closePath();
  const head = new THREE.Mesh(new THREE.ExtrudeGeometry(shape, { depth: 0.035, bevelEnabled: false }), M.playhead);
  head.rotation.x = -Math.PI / 2; head.position.set(0, 0.006, -1.38);
  const knob = new THREE.Mesh(new RoundedBoxGeometry(0.17, 0.09, 0.17, 2, 0.03), M.playhead);
  knob.position.set(0, 0.045, 1.33);
  playhead.add(line, head, knob);
}
scene.add(playhead);
const playLight = new THREE.PointLight(HEX.accent, 0, 2.4, 2);
scene.add(playLight);

function playheadX(f) {
  f = wrap(f);
  const F = JUMPS[4];
  if (f <= F.T) return RULER_X0 + f / 30;                       // constant speed: crosses each diamond on its landing
  if (f <= F.L) {                                              // rewind under the flip
    const xm = lerp(F.x0, F.x1, (f - F.T) / (F.L - F.T));
    return xm + 1.5 * (1 - sstep(F.T, F.T + 18, f));
  }
  const v = (F.x1 - F.x0) / (F.L - F.T), dist = RULER_X0 - F.x1;   // decelerate to frame 0
  const T = 2 * dist / v, u = Math.min(f - F.L, T);
  return F.x1 + v * u - 0.5 * (v / T) * u * u;
}

// ---------- the mascot (0.1 voxels) ----------
const V = 0.1;
const voxGeo = new RoundedBoxGeometry(V, V, V, 1, 0.016);
function voxelMesh(cells, mat, seed, shade = 0.03) {
  const m = new THREE.InstancedMesh(voxGeo, mat, cells.length);
  const o = new THREE.Object3D(), r = mulberry32(seed), c = new THREE.Color();
  cells.forEach(([x, y, z], i) => {
    o.position.set(x, y, z); o.updateMatrix(); m.setMatrixAt(i, o.matrix);
    const k = 1 - shade / 2 + shade * r(); m.setColorAt(i, c.setRGB(k, k, k));
  });
  m.castShadow = true; m.receiveShadow = true;
  return m;
}
function block(nx, ny, nz, cx, y0, cz, surfaceOnly = true) {
  const out = [];
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) for (let k = 0; k < nz; k++) {
    if (surfaceOnly && i > 0 && j > 0 && k > 0 && i < nx - 1 && j < ny - 1 && k < nz - 1) continue;
    out.push([cx + (i - (nx - 1) / 2) * V, y0 + (j + 0.5) * V, cz + (k - (nz - 1) / 2) * V]);
  }
  return out;
}
const LEG_H = 0.3, BODY_W = 1.4, BODY_D = 0.8;
const mascot = { rig: new THREE.Group(), leanG: new THREE.Group(), def: new THREE.Group() };
mascot.rig.add(mascot.leanG); mascot.leanG.add(mascot.def);
mascot.leanG.position.y = -COM;
mascot.def.add(voxelMesh(block(14, 10, 8, 0, LEG_H, 0), M.body, 11));
mascot.eyes = [-0.3, 0.3].map((ex, i) => {
  const g = new THREE.Group(); g.position.set(ex, LEG_H + 0.65, BODY_D / 2 - V / 2 + 0.022);
  g.add(voxelMesh(block(2, 3, 1, 0, -0.15, 0, false), M.eye, 21 + i, 0));
  mascot.def.add(g); return g;
});
mascot.legs = [-0.5, -0.2, 0.2, 0.5].map((lx, i) => {
  const g = new THREE.Group(); g.position.set(lx, LEG_H, 0.3);
  g.add(voxelMesh(block(2, 3, 2, 0, -LEG_H, 0, false), M.body, 31 + i));
  mascot.def.add(g); return g;
});

      noiseSrc(t, 0.12).connect(filt('lowpass', 900, 0.8, ng));
    }
    if (on('tings')) {
      const t = o + AT(J.L), pan = PAN(J.x1);
      SPARKS[j].forEach((p, s) => {
        const tt = t + p.delay + s * (big ? 0.007 : 0.01), f0 = NOTE(TINGS[Math.floor(p.pitch * TINGS.length)] + (big ? 0 : 0));
        const dd = out(clamp(pan + Math.cos(p.a) * 0.45, -0.9, 0.9), 0.45), ag = gain(0, dd);
        env(ag, tt, big ? 0.09 : 0.065, 0.0015, 0.07 + 0.08 * p.pitch);
        const car = osc('sine', f0, tt, tt + 0.8, ag), mg = gain(f0 * 1.4, car.frequency);
        mg.gain.setValueAtTime(f0 * 1.4, tt); mg.gain.setTargetAtTime(0, tt, 0.04);
        osc('sine', f0 * 3.53, tt, tt + 0.8, mg);
      });
    }
  });

  // ---- label pings ----
  if (on('pings')) [81, 84, 86, 89, 93].forEach((m, i) => {
    const t = o + AT(LABEL_FRAMES[i]), g = gain(0, out(-0.45, 0.45)), f0 = NOTE(m);
    env(g, t, 0.3, 0.002, 0.24);
    osc('sine', f0, t, t + 1.6, g); osc('sine', f0 * 2, t, t + 1.6, gain(0.16, g)); osc('sine', f0 * 3, t, t + 1.6, gain(0.04, g));

  // ---- dotted arc ticks, 303..318 ----
  if (on('ticks')) for (let i = 0; i < ARC_DOTS; i++) {
    const t = o + AT(ARC_F0 + i), d = out(lerp(0.55, -0.55, i / (ARC_DOTS - 1)), 0.25), g = gain(0, d);
    env(g, t, 0.45, 0.0005, 0.003);

    const fc = new Float32Array(K), amp = new Float32Array(K), pan = new Float32Array(K), fc2 = new Float32Array(K);
    for (let i = 0; i < K; i++) {

      amp[i] = 0.62 * Math.sin(Math.PI * Math.min(1, u * 1.05)) ** 1.2 * (0.78 + 0.22 * Math.cos(b.rot));
      pan[i] = PAN(b.x);

    const p = ctx.createStereoPanner(); p.connect(bus.master);
    const s = gain(0.25, bus.verbIn); p.connect(s);
    const g = ctx.createGain(); g.connect(p); g.gain.setValueAtTime(0, t0); g.gain.setValueCurveAtTime(amp, t0, dur);
    p.pan.setValueAtTime(pan[0], t0); p.pan.setValueCurveAtTime(pan, t0, dur);
    const b1 = filt('bandpass', 500, 1.3, g); b1.frequency.setValueCurveAtTime(fc, t0, dur);
    const b2g = gain(0.35, g), b2 = filt('bandpass', 1000, 3.2, b2g); b2.frequency.setValueCurveAtTime(fc2, t0, dur);
    const n = noiseSrc(t0, dur + 0.1); n.connect(b1); n.connect(b2);
  }

  // ---- blink blip ----
  if (on('blink')) {
    const t = o + AT(BLINK), g = gain(0, out(PAN(-4), 0.3));
    env(g, t, 0.22, 0.002, 0.025);
    const n = osc('sine', 1250, t, t + 0.2, g); n.frequency.exponentialRampToValueAtTime(1950, t + 0.04);
  }
}

// ---- mastering: BS.1770 loudness, 4x true-peak limiter, all cyclic so the loop stays seamless ----
function kWeightMeanSquare(x) {
  const n = x.length, y = new Float64Array(n);
  const st = [[1.53512485958697, -2.69169618940638, 1.19839281085285, -1.69065929318241, 0.73248077421585],
    [1.0, -2.0, 1.0, -1.99004745483398, 0.99007225036621]];
  let buf = x;
  for (const [b0, b1, b2, a1, a2] of st) {
    const out = new Float64Array(n); let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
    for (let pass = 0; pass < 2; pass++) for (let i = 0; i < n; i++) {     // second pass = settled cyclic state
      const v = buf[i], o = b0 * v + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
      x2 = x1; x1 = v; y2 = y1; y1 = o; if (pass) out[i] = o;
    }
    buf = out;
  }
  for (let i = 0; i < n; i++) y[i] = buf[i] * buf[i];
  return y;
}
function loudness(L, R) {
  const n = L.length, ml = kWeightMeanSquare(L), mr = kWeightMeanSquare(R);
  const win = Math.round(0.4 * SR), hop = Math.round(0.1 * SR), blocks = [];
  const cl = new Float64Array(n + 1), cr = new Float64Array(n + 1);
  for (let i = 0; i < n; i++) { cl[i + 1] = cl[i] + ml[i]; cr[i + 1] = cr[i] + mr[i]; }
  const sum = (c, a, b) => (b <= n ? c[b] - c[a] : c[n] - c[a] + c[b - n]);
  for (let s = 0; s < n; s += hop) blocks.push((sum(cl, s, s + win) + sum(cr, s, s + win)) / win);
  const lk = (z) => -0.691 + 10 * Math.log10(z);
  let g = blocks.filter((z) => lk(z) > -70);
  const rel = lk(g.reduce((a, b) => a + b, 0) / g.length) - 10;
  g = g.filter((z) => lk(z) > rel);
  return lk(g.reduce((a, b) => a + b, 0) / g.length);
}
const OS_TAPS = 16, OS_H = [1, 2, 3].map((p) => {
  const h = [];
  for (let k = -OS_TAPS; k <= OS_TAPS; k++) {
    const t = k + p / 4, w = 0.5 + 0.5 * Math.cos(Math.PI * t / (OS_TAPS + 1));
    h.push((t === 0 ? 1 : Math.sin(Math.PI * t) / (Math.PI * t)) * w);
  }
  return h;
});
function peakEnvelope(chs) {                                  // per-sample max of |x| incl. 4x inter-sample peaks
  const n = chs[0].length, e = new Float32Array(n);
  for (const x of chs) for (let i = 0; i < n; i++) {
    let m = Math.abs(x[i]);
    for (const h of OS_H) {
      let v = 0;
      for (let k = -OS_TAPS; k <= OS_TAPS; k++) v += x[(i + k + n) % n] * h[k + OS_TAPS];
      if (Math.abs(v) > m) m = Math.abs(v);
    }
    if (m > e[i]) e[i] = m;
  }
  return e;
}
function limit(chs, ceiling) {
  const n = chs[0].length, e = peakEnvelope(chs), A = 72, req = new Float32Array(n), g1 = new Float32Array(n), g2 = new Float32Array(n);
  for (let i = 0; i < n; i++) req[i] = Math.min(1, ceiling / Math.max(e[i], 1e-9));
  for (let i = 0; i < n; i++) { let m = 1; for (let k = -1; k <= A; k++) m = Math.min(m, req[(i + k + n) % n]); g1[i] = m; }
  let acc = 0; for (let k = 0; k < A; k++) acc += g1[(n - k) % n];
  for (let i = 0; i < n; i++) { acc += g1[i] - g1[(i - A + n) % n]; g2[i] = acc / A; }
  const rel = 1 - Math.exp(-1 / (0.07 * SR)); let g = 1, minG = 1;
  const g3 = new Float32Array(n);
  for (let pass = 0; pass < 2; pass++) for (let i = 0; i < n; i++) { g = Math.min(g2[i], g + (1 - g) * rel); g3[i] = Math.min(g, req[i] * 1.0 + 0 * g2[i]); if (pass) minG = Math.min(minG, g3[i]); }
  for (const x of chs) for (let i = 0; i < n; i++) x[i] *= g3[i];
  return 20 * Math.log10(minG);
}
function truePeakDb(chs) { const e = peakEnvelope(chs); let m = 0; for (const v of e) m = Math.max(m, v); return 20 * Math.log10(m); }
function wav24(chs) {
  const n = chs[0].length, nc = chs.length, bytes = 44 + n * nc * 3, buf = new ArrayBuffer(bytes), v = new DataView(buf);
  const str = (o, s) => { for (let i = 0; i < s.length; i++) v.setUint8(o + i, s.charCodeAt(i)); };
  str(0, 'RIFF'); v.setUint32(4, bytes - 8, true); str(8, 'WAVE'); str(12, 'fmt '); v.setUint32(16, 16, true);
  v.setUint16(20, 1, true); v.setUint16(22, nc, true); v.setUint32(24, SR, true); v.setUint32(28, SR * nc * 3, true);
  v.setUint16(32, nc * 3, true); v.setUint16(34, 24, true); str(36, 'data'); v.setUint32(40, n * nc * 3, true);
  let o = 44;
  for (let i = 0; i < n; i++) for (let c = 0; c < nc; c++) {
    const s = Math.max(-8388608, Math.min(8388607, Math.round(chs[c][i] * 8388607)));
    v.setUint8(o, s & 255); v.setUint8(o + 1, (s >> 8) & 255); v.setUint8(o + 2, (s >> 16) & 255); o += 3;
  }
  return new Uint8Array(buf);
}

window.renderAudio = async (opts = {}) => {
  const LOOPS = 3, n = Math.round(SR * LOOP_S);
  const ctx = new OfflineAudioContext({ numberOfChannels: 2, length: n * LOOPS, sampleRate: SR });
  const master = ctx.createGain(); master.gain.value = 0.5; master.connect(ctx.destination);
  const verb = ctx.createConvolver(); verb.normalize = false; verb.buffer = makeIR(ctx, 1.8, mulberry32(91));
  const verbIn = ctx.createGain(); const verbHp = ctx.createBiquadFilter(); verbHp.type = 'highpass'; verbHp.frequency.value = 280; verbIn.connect(verbHp); verbHp.connect(verb); const verbOut = ctx.createGain(); verbOut.gain.value = 0.3; verb.connect(verbOut); verbOut.connect(master);
  const noise = makeNoise(ctx, 3, mulberry32(77));
  const out = (pan = 0, send = 0.15) => {
    const g = ctx.createGain(), p = ctx.createStereoPanner(); p.pan.value = clamp(pan, -1, 1);
    g.connect(p); p.connect(master);
    if (send > 0) { const s = ctx.createGain(); s.gain.value = send; p.connect(s); s.connect(verbIn); }
    return g;
  };
  const bus = { out, noise, master, verbIn, solo: opts.solo || null, group: '' };
  for (let k = 0; k < LOOPS; k++) scoreLoop(ctx, bus, k * LOOP_S);
  const rendered = await ctx.startRendering();
  const chs = [0, 1].map((c) => rendered.getChannelData(c).slice(n, 2 * n));    // the middle pass
  const raw = { lufs: loudness(chs[0], chs[1]), tp: truePeakDb(chs) };
  if (opts.solo || opts.raw) return { stats: { rawLufs: +raw.lufs.toFixed(2), rawTruePeakDb: +raw.tp.toFixed(2) }, wav: opts.raw ? (() => { const b = wav24(chs); let bin = ''; for (let i = 0; i < b.length; i += 0x8000) bin += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000)); return btoa(bin); })() : null };
  // master: gain to -14 LUFS, cyclic 4x true-peak limiter at -1.2 dBTP, iterate until within 0.1 LU
  let gainDb = AUDIO_TARGET.lufs - raw.lufs, outCh, lu, grDb;
  for (let it = 0; it < 8; it++) {
    const gl = 10 ** (gainDb / 20);
    outCh = chs.map((x) => Float32Array.from(x, (v) => v * gl));
    grDb = limit(outCh, 10 ** (AUDIO_TARGET.ceilingDbtp / 20));
    lu = loudness(outCh[0], outCh[1]);
    if (Math.abs(lu - AUDIO_TARGET.lufs) <= 0.05) break;
    gainDb += AUDIO_TARGET.lufs - lu;
  }
  const stats = { rawLufs: +raw.lufs.toFixed(2), rawTruePeakDb: +raw.tp.toFixed(2), gainDb: +gainDb.toFixed(2),
    maxGainReductionDb: +grDb.toFixed(2), lufs: +lu.toFixed(2), truePeakDbtp: +truePeakDb(outCh).toFixed(2),
    seamDelta: +Math.max(Math.abs(outCh[0][0] - outCh[0][n - 1]), Math.abs(outCh[1][0] - outCh[1][n - 1])).toFixed(5) };
  if (opts.asBuffer) {
    const b = new AudioBuffer({ numberOfChannels: 2, length: n, sampleRate: SR });
    b.copyToChannel(outCh[0], 0); b.copyToChannel(outCh[1], 1);
    return { buffer: b, stats };
  }
  const bytes = wav24(outCh); let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return { wav: btoa(bin), stats };
};

// ---------- boot ----------
await document.fonts.load(LBL.font);
await document.fonts.load('500 120px "Geist Mono"');
ruler = new THREE.Mesh(new THREE.PlaneGeometry(RULER.x1 - RULER.x0, RULER.z1 - RULER.z0),
  new THREE.MeshStandardMaterial({ map: rulerTexture(), transparent: true, roughness: 0.6, depthWrite: false, polygonOffset: true, polygonOffsetFactor: -2 }));
ruler.rotation.x = -Math.PI / 2;
ruler.position.set((RULER.x0 + RULER.x1) / 2, 0.002, (RULER.z0 + RULER.z1) / 2);
ruler.receiveShadow = true;
scene.add(ruler);

renderer.compile(scene, camera);
window.renderAt(0);
window.filmReady = true;

if (!RENDER) {
  let t0 = performance.now(), audio = null;
  const tick = () => { window.renderAt(((performance.now() - t0) / 1000) % LOOP_S); requestAnimationFrame(tick); };
  requestAnimationFrame(tick);
  canvas.addEventListener('click', async () => {
    if (audio) { audio.ctx.close(); audio = null; return; }
    if (!window.renderAudio) return;
    const { buffer } = await window.renderAudio({ asBuffer: true });
    const ctx = new AudioContext({ sampleRate: buffer.sampleRate });
    const src = ctx.createBufferSource(); src.buffer = buffer; src.loop = true; src.connect(ctx.destination);
