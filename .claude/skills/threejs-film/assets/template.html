<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

{

<style>

  html, body { margin: 0; height: 100%; background: #111; }
  body { display: grid; place-items: center; overflow: hidden; }
  #film { display: block; max-width: 100vw; max-height: 100vh; cursor: pointer; }
  body.render { display: block; }
  body.render #film { max-width: none; max-height: none; cursor: default; }
</style>

<body>
<canvas id="film"></canvas>
<script type="module">
import * as THREE from 'three';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

// =====================================================================================
// Frame-exact three.js film. window.renderAt(t) paints any frame from t alone; all randomness is
// seeded; secondary motion that needs history is simulated once at load into tables.
// window.renderAudio() synthesizes the score offline (Web Audio) and returns a mastered WAV.
//
// Sections marked SCENE are the film. Everything else is the engine: keep it unless the brief needs
// a change, and keep the window.* contract (FILM, renderAt, frameCheck, renderAudio, filmReady).
// =====================================================================================

// ------------------------------------------------------------------ FILM (scene) ----
const FILM = { title: '__TITLE__', W: __W__, H: __H__, FPS: __FPS__, SECONDS: __SECONDS__, LOOP: __LOOP__ };
const { W, H, FPS } = FILM, N = Math.round(FILM.SECONDS * FPS), DUR = N / FPS;
window.FILM = { ...FILM, frames: N, duration: DUR };
const RENDER = new URLSearchParams(location.search).has('render');
if (RENDER) document.body.classList.add('render');

// ------------------------------------------------------------------ math ------------
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, t) => a + (b - a) * t;
const sstep = (a, b, x) => { const t = clamp((x - a) / (b - a)); return t * t * (3 - 2 * t); };
const easeOutCubic = (t) => 1 - Math.pow(1 - t, 3);
const easeInQuad = (t) => t * t;
const easeInOutCubic = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
const easeInOutSine = (t) => -(Math.cos(Math.PI * t) - 1) / 2;
const rad = THREE.MathUtils.degToRad;
// Loops wrap time; one-shots clamp it.
const wrap = (f) => (FILM.LOOP ? ((f % N) + N) % N : clamp(f, 0, N - 1));
function mulberry32(a) {
  return () => {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
// Damped spring released from a displacement (step response, zero start velocity): 1 -> 0.
function springStep(tau, zeta, hz) {
  if (tau <= 0) return 1;
  const w = 2 * Math.PI * hz, s = Math.sqrt(1 - zeta * zeta), wd = w * s;
  return Math.exp(-zeta * w * tau) * (Math.cos(wd * tau) + (zeta / s) * Math.sin(wd * tau));
}
// Keyed values: keys = [[frame, value], ...] with an ease per segment.
function keys(k, f, ease = easeInOutSine) {
  if (f <= k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (f <= k[i][0]) return lerp(k[i - 1][1], k[i][1], ease((f - k[i - 1][0]) / Math.max(1e-6, k[i][0] - k[i - 1][0])));
  return k[k.length - 1][1];
}

// Secondary motion with history (limbs driven by the body's acceleration, follow cameras) is simulated
// once here over three passes, so the stored table is the loop's steady state; renderAt only reads it.
const SUB = 8, NS = N * SUB;
function accelSpring(signal, { hz, zeta, gain, lag = 0 }) {
  const dt = 1 / (FPS * SUB), s = new Float64Array(NS), out = new Float32Array(NS);
  for (let n = 0; n < NS; n++) s[n] = signal(n / SUB);
  const at = (n) => s[FILM.LOOP ? ((n % NS) + NS) % NS : clamp(n, 0, NS - 1)];
  const acc = (n) => (at(n + 1) - 2 * at(n) + at(n - 1)) / (dt * dt);
  const w = 2 * Math.PI * hz; let x = 0, v = 0;
  for (let pass = 0; pass < (FILM.LOOP ? 3 : 1); pass++) {
    for (let n = 0; n < NS; n++) {
      v += (-w * w * x - 2 * zeta * w * v - gain * acc(n - lag * SUB)) * dt; x += v * dt;
      if (pass === (FILM.LOOP ? 2 : 0)) out[n] = x;
    }
  }
  return out;
}
function followTable(target, hz) {
  const dt = 1 / (FPS * SUB), out = new Float32Array(NS), w = 2 * Math.PI * hz;
  let x = target(0), v = 0;
  for (let pass = 0; pass < (FILM.LOOP ? 3 : 1); pass++) {
    for (let n = 0; n < NS; n++) {
      v += (w * w * (target(n / SUB) - x) - 2 * w * v) * dt; x += v * dt;
      if (pass === (FILM.LOOP ? 2 : 0)) out[n] = x;
    }
  }
  return out;
}
function tab(arr, f) {
  const p = wrap(f) * SUB, i = Math.floor(p), u = p - i;
  return lerp(arr[i % NS], arr[Math.min(i + 1, FILM.LOOP ? i + 1 : NS - 1) % NS], u);
}
// Colour temperature -> linear RGB at unit luminance, tempered toward neutral by (1 - strength).
function kelvin(K, strength = 1) {
  const t = K / 100; let r, g, b;
  if (t <= 66) { r = 255; g = 99.4708025861 * Math.log(t) - 161.1195681661; b = t <= 19 ? 0 : 138.5177312231 * Math.log(t - 10) - 305.0447927307; }
  else { r = 329.698727446 * Math.pow(t - 60, -0.1332047592); g = 288.1221695283 * Math.pow(t - 60, -0.0755148492); b = 255; }
  const c = new THREE.Color().setRGB(clamp(r / 255), clamp(g / 255), clamp(b / 255), THREE.SRGBColorSpace);
  c.lerp(new THREE.Color(1, 1, 1), 1 - strength);
  return c.multiplyScalar(1 / (0.2126 * c.r + 0.7152 * c.g + 0.0722 * c.b));
}
// A light that clicks on with a short flicker and snaps off.
const FLICKER = [1.0, 0.08, 0.6];
function lightLevel(on, f, off = Infinity) {
  if (f < on || f >= off) return 0;
  const i = Math.floor(f - on + 1e-6);
  return i < FLICKER.length ? FLICKER[i] : 1;
}

// ------------------------------------------------------------------ renderer -------
const canvas = document.getElementById('film');
canvas.width = W; canvas.height = H;
if (RENDER) { canvas.style.width = W + 'px'; canvas.style.height = H + 'px'; }
else { canvas.style.aspectRatio = `${W} / ${H}`; canvas.style.width = W >= H ? 'min(100vw, ' + (100 * W / H) + 'vh)' : 'auto'; canvas.style.height = W >= H ? 'auto' : 'min(100vh, ' + (100 * H / W) + 'vw)'; }
const renderer = new THREE.WebGLRenderer({ canvas, antialias: false, preserveDrawingBuffer: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(1); renderer.setSize(W, H, false);
renderer.toneMapping = THREE.NoToneMapping;                    // the final pass grades
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFShadowMap; renderer.shadowMap.autoUpdate = false;
const MAX_ANISO = renderer.capabilities.getMaxAnisotropy();
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(24, W / H, 2, 200);

// ------------------------------------------------------------------ overlay text ----
// 2D type is drawn here and composited after the grade, so it stays crisp and on-colour.
const overlay = document.createElement('canvas'); overlay.width = W; overlay.height = H;
const octx = overlay.getContext('2d');
const overlayTex = new THREE.CanvasTexture(overlay);
overlayTex.colorSpace = THREE.NoColorSpace; overlayTex.minFilter = THREE.LinearFilter; overlayTex.generateMipmaps = false;
let overlayKey = null;
function setOverlay(key, draw) { if (key === overlayKey) return; overlayKey = key; octx.clearRect(0, 0, W, H); draw(octx); overlayTex.needsUpdate = true; }

// ------------------------------------------------------------------ post -----------
// scene (HDR, 4x MSAA) -> depth pre-pass -> DOF -> bloom (max-channel threshold) -> white balance ->
// hue-preserving shoulder -> sRGB -> vignette -> overlay -> grain + dither
const rtScene = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType, samples: 4 });
const rtDepth = new THREE.WebGLRenderTarget(W, H, { depthTexture: new THREE.DepthTexture(W, H, THREE.FloatType) });
const rtDof = new THREE.WebGLRenderTarget(W, H, { type: THREE.HalfFloatType });
const BLOOM_LEVELS = 6, rtDown = [], rtUp = [];
for (let i = 0; i < BLOOM_LEVELS; i++) {
  const w = Math.max(1, Math.round(W / 2 ** (i + 1))), h = Math.max(1, Math.round(H / 2 ** (i + 1)));
  rtDown.push(new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType }));
  rtUp.push(new THREE.WebGLRenderTarget(w, h, { type: THREE.HalfFloatType }));
}
const depthOnly = new THREE.MeshBasicMaterial({ colorWrite: false });
const quadScene = new THREE.Scene(), quadCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const quadGeo = new THREE.BufferGeometry();
quadGeo.setAttribute('position', new THREE.Float32BufferAttribute([-1, -1, 0, 3, -1, 0, -1, 3, 0], 3));
quadGeo.setAttribute('uv', new THREE.Float32BufferAttribute([0, 0, 2, 0, 0, 2], 2));
const quad = new THREE.Mesh(quadGeo); quad.frustumCulled = false; quadScene.add(quad);
const VERT = 'varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }';
const shader = (frag, uniforms) => new THREE.ShaderMaterial({ vertexShader: VERT, fragmentShader: frag, uniforms, depthTest: false, depthWrite: false });
function pass(mat, target) { quad.material = mat; renderer.setRenderTarget(target); renderer.render(quadScene, quadCam); }

const dofMat = shader(`
  uniform sampler2D tColor, tDepth; uniform vec2 texel; uniform float near, far, focus, cocK, maxCoc;
  varying vec2 vUv;
  float linZ(vec2 uv){ float d = texture2D(tDepth, uv).x; return near * far / (far - d * (far - near)); }
  float coc(float z){ return min(maxCoc, cocK * abs(1.0 / focus - 1.0 / z)); }
  void main(){
    vec3 c0 = texture2D(tColor, vUv).rgb; float z0 = linZ(vUv); float r0 = coc(z0);
    vec3 acc = c0; float ws = 1.0;
    for (int i = 0; i < 48; i++) {
      float fi = float(i) + 0.5; float r = sqrt(fi / 48.0) * maxCoc; float a = fi * 2.39996323;
      vec2 uv = vUv + vec2(cos(a), sin(a)) * r * texel;
      float zs = linZ(uv); float rs = coc(zs);
      if (zs > z0) rs = min(rs, r0);                     // background never spills over nearer pixels
      float w = smoothstep(r - 1.0, r + 0.5, rs);
      acc += texture2D(tColor, uv).rgb * w; ws += w;
    }
    gl_FragColor = vec4(acc / ws, 1.0);
  }`, { tColor: { value: null }, tDepth: { value: null }, texel: { value: new THREE.Vector2(1 / W, 1 / H) },
  near: { value: camera.near }, far: { value: camera.far }, focus: { value: 10 }, cocK: { value: 0 }, maxCoc: { value: 9 } });
const prefilterMat = shader(`
  uniform sampler2D tSrc; uniform vec2 texel; uniform float thr, knee; varying vec2 vUv;
  void main(){
    vec3 c = 0.25 * (texture2D(tSrc, vUv + texel * vec2(-0.5,-0.5)).rgb + texture2D(tSrc, vUv + texel * vec2(0.5,-0.5)).rgb
               + texture2D(tSrc, vUv + texel * vec2(-0.5,0.5)).rgb + texture2D(tSrc, vUv + texel * vec2(0.5,0.5)).rgb);
    float m = max(c.r, max(c.g, c.b));
    float s = clamp(m - thr + knee, 0.0, 2.0 * knee); s = s * s / (4.0 * knee + 1e-4);
    gl_FragColor = vec4(c * max(s, m - thr) / max(m, 1e-4), 1.0);
  }`, { tSrc: { value: null }, texel: { value: new THREE.Vector2() }, thr: { value: 1.3 }, knee: { value: 0.3 } });
const downMat = shader(`
  uniform sampler2D tSrc; uniform vec2 texel; varying vec2 vUv;
  void main(){
    vec3 c = texture2D(tSrc, vUv).rgb * 4.0;
    c += texture2D(tSrc, vUv + texel * vec2(-1.0,-1.0)).rgb + texture2D(tSrc, vUv + texel * vec2(1.0,-1.0)).rgb;
    c += texture2D(tSrc, vUv + texel * vec2(-1.0,1.0)).rgb + texture2D(tSrc, vUv + texel * vec2(1.0,1.0)).rgb;
    gl_FragColor = vec4(c / 8.0, 1.0);
  }`, { tSrc: { value: null }, texel: { value: new THREE.Vector2() } });
const upMat = shader(`
  uniform sampler2D tSrc, tAdd; uniform vec2 texel; varying vec2 vUv;
  void main(){
    vec3 c = texture2D(tSrc, vUv + texel * vec2(-2.0, 0.0)).rgb + texture2D(tSrc, vUv + texel * vec2(2.0, 0.0)).rgb;
    c += texture2D(tSrc, vUv + texel * vec2(0.0, -2.0)).rgb + texture2D(tSrc, vUv + texel * vec2(0.0, 2.0)).rgb;
    c += 2.0 * (texture2D(tSrc, vUv + texel * vec2(-1.0,-1.0)).rgb + texture2D(tSrc, vUv + texel * vec2(1.0,-1.0)).rgb);
    c += 2.0 * (texture2D(tSrc, vUv + texel * vec2(-1.0,1.0)).rgb + texture2D(tSrc, vUv + texel * vec2(1.0,1.0)).rgb);
    gl_FragColor = vec4(c / 12.0 + texture2D(tAdd, vUv).rgb, 1.0);
  }`, { tSrc: { value: null }, tAdd: { value: null }, texel: { value: new THREE.Vector2() } });
const finalMat = shader(`
  uniform sampler2D tColor, tBloom, tOverlay; uniform float bloom, frame, grain, vignette, shoulder; uniform vec3 wb; varying vec2 vUv;
  float hash(vec3 p){ p = fract(p * vec3(0.1031, 0.1030, 0.0973)); p += dot(p, p.yxz + 33.33); return fract((p.x + p.y) * p.z); }
  vec3 toSRGB(vec3 c){ c = max(c, 0.0); return mix(c * 12.92, 1.055 * pow(c, vec3(1.0 / 2.4)) - 0.055, step(0.0031308, c)); }
  void main(){
    vec3 c = (texture2D(tColor, vUv).rgb + bloom * texture2D(tBloom, vUv).rgb) * wb;
    float m = max(c.r, max(c.g, c.b));
    if (m > shoulder) c *= (shoulder + (1.0 - shoulder) * (1.0 - exp(-(m - shoulder) / (1.0 - shoulder)))) / m;
    c = toSRGB(c);
    vec2 d = (vUv - 0.5) * 2.0;
    c *= 1.0 - vignette * smoothstep(0.3, 1.4142, length(d));
    vec4 L = texture2D(tOverlay, vUv); c = mix(c, L.rgb, L.a);
    vec2 px = gl_FragCoord.xy;
    float g1 = hash(vec3(px, frame * 7.13 + 1.0)), g2 = hash(vec3(px + 17.0, frame * 3.71 + 5.0));
    float d1 = hash(vec3(px + 41.0, frame * 1.93 + 9.0)), d2 = hash(vec3(px + 83.0, frame * 5.37 + 2.0));
    c += (g1 + g2 - 1.0) * grain + (d1 + d2 - 1.0) / 255.0;
    gl_FragColor = vec4(clamp(c, 0.0, 1.0), 1.0);
  }`, { tColor: { value: rtDof.texture }, tBloom: { value: null }, tOverlay: { value: overlayTex },
  bloom: { value: 0.55 }, frame: { value: 0 }, grain: { value: 0.02 }, vignette: { value: 0.10 }, shoulder: { value: 0.84 },
  wb: { value: new THREE.Vector3(1, 1, 1) } });

// Graded backdrop: an unlit floor whose level follows the lights (so cone edges never streak across it),
// with a soft falloff and the soft shadow of whatever floats above it.
function makeBackdrop({ y = -1.5, shadowCenter = [0, 0.8], shadowHalf = [2, 2], shadowRound = 0.6, shadowDark = 0.45, shadowSoft = [-1.2, 2.6] } = {}) {
  const mat = new THREE.ShaderMaterial({
    uniforms: { uColor: { value: new THREE.Color() } },
    vertexShader: 'varying vec3 vW; void main(){ vec4 w = modelMatrix * vec4(position, 1.0); vW = w.xyz; gl_Position = projectionMatrix * viewMatrix * w; }',
    fragmentShader: `
      uniform vec3 uColor; varying vec3 vW;
      float box(vec2 p, vec2 b, float r){ vec2 q = abs(p) - b + r; return length(max(q, 0.0)) + min(max(q.x, q.y), 0.0) - r; }
      void main(){
        float pool = 1.0 - 0.16 * smoothstep(3.0, 26.0, length(vW.xz - vec2(0.0, -2.0)));
        float d = box(vW.xz - vec2(${shadowCenter[0].toFixed(3)}, ${shadowCenter[1].toFixed(3)}), vec2(${shadowHalf[0].toFixed(3)}, ${shadowHalf[1].toFixed(3)}), ${shadowRound.toFixed(3)});
        float shade = 1.0 - ${shadowDark.toFixed(3)} * (1.0 - smoothstep(${shadowSoft[0].toFixed(3)}, ${shadowSoft[1].toFixed(3)}, d));
        gl_FragColor = vec4(uColor * pool * shade, 1.0);
      }`,
  });
  const m = new THREE.Mesh(new THREE.PlaneGeometry(500, 500), mat);
  m.rotation.x = -Math.PI / 2; m.position.y = y;
  return m;
}

// ------------------------------------------------------------------ checks ---------
// The render tool reads these: props must stay out of keepOut rects and inside the frame where the
// beat sheet says so; probes are world points whose graded colour the tool samples.
const CHECK = { props: {}, keepOut: [], probes: {}, notes: {} };
const _v = new THREE.Vector3();
function project(p) { _v.copy(p).project(camera); return [(_v.x * 0.5 + 0.5) * W, (1 - (_v.y * 0.5 + 0.5)) * H]; }
function rectOf(obj) {
  const box = new THREE.Box3().setFromObject(obj), r = { x0: Infinity, y0: Infinity, x1: -Infinity, y1: -Infinity };
  if (box.isEmpty()) return null;
  for (let i = 0; i < 8; i++) {
    const [x, y] = project(_v.set(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).clone());
    r.x0 = Math.min(r.x0, x); r.x1 = Math.max(r.x1, x); r.y0 = Math.min(r.y0, y); r.y1 = Math.max(r.y1, y);
  }
  return r;
}

// =================================================================== SCENE ==========
// Demo scene: a voxel cube on a floating plinth. The key light clicks on, the cube crouches, hops,
// lands with squash and a spring, its antennae trail (overlapping action), sparks fly, a label checks
// off, the light snaps off and the loop returns to frame 0. Replace all of it with the brief.

const PAL = { hero: 0xD97757, accent: 0xFF6A2B, ink: 0x0F0F0F, backdrop: 0xF4F2EE, gray: 0x8E8A83, white: 0xFFFFFF };
const CSS = { accent: '#FF6A2B', ink: '#0F0F0F', gray: '#8E8A83' };

// Timeline, in frames. Every visual event lives here so picture and score share one source of truth.
const T = { keyOn: 6, crouch: 60, takeoff: 72, land: 108, off: N - 12 };
const HOP = { h: 1.0, crouch: [1.2, 0.75], stretch: [0.85, 1.28], land: [1.25, 0.7], spring: { zeta: 0.55, hz: 3.2 } };
const GROUND = 0, HALF = 0.3;            // plinth top; half the cube's height

// Look: grade levels. Lights-off sits near 50%; each light adds its own bounce so the click reads.
const TEMP = { key: kelvin(3200, 0.3), rim: kelvin(7500, 0.8) };
const LEVELS = { fill: 0.6, key: 3.3, rim: 2.0, bounceKey: 0.12, bounceRim: 0.05, backOff: 0.25, backKey: 0.33, backRim: 0.085 };

const M = {
  plinth: new THREE.MeshStandardMaterial({ color: PAL.white, roughness: 0.55 }),
  hero: new THREE.MeshPhysicalMaterial({ color: PAL.hero, roughness: 0.45, clearcoat: 0.3, clearcoatRoughness: 0.3 }),
  ink: new THREE.MeshPhysicalMaterial({ color: PAL.ink, roughness: 0.3, clearcoat: 0.8 }),
  spark: new THREE.MeshBasicMaterial({ color: PAL.accent }),
};

const backdrop = makeBackdrop({ y: -1.4, shadowCenter: [0, 0.9], shadowHalf: [2.0, 2.0], shadowRound: 0.5 });
scene.add(backdrop);
const BACKDROP_LIN = new THREE.Color(PAL.backdrop);

const plinth = new THREE.Mesh(new RoundedBoxGeometry(4, 0.4, 4, 3, 0.06), M.plinth);
plinth.position.y = -0.2; plinth.receiveShadow = true; scene.add(plinth);

// Voxel hero: surface voxels of a 6x6x6 block, two eyes, two antennae.
const V = 0.1, voxGeo = new RoundedBoxGeometry(V, V, V, 1, 0.016);
function voxels(cells, mat, seed) {
  const m = new THREE.InstancedMesh(voxGeo, mat, cells.length), o = new THREE.Object3D(), r = mulberry32(seed), c = new THREE.Color();
  cells.forEach(([x, y, z], i) => { o.position.set(x, y, z); o.updateMatrix(); m.setMatrixAt(i, o.matrix); const k = 0.985 + 0.03 * r(); m.setColorAt(i, c.setRGB(k, k, k)); });
  m.castShadow = true; m.receiveShadow = true; return m;
}
function block(nx, ny, nz, cx, y0, cz, surface = true) {
  const out = [];
  for (let i = 0; i < nx; i++) for (let j = 0; j < ny; j++) for (let k = 0; k < nz; k++) {
    if (surface && i > 0 && j > 0 && k > 0 && i < nx - 1 && j < ny - 1 && k < nz - 1) continue;
    out.push([cx + (i - (nx - 1) / 2) * V, y0 + (j + 0.5) * V, cz + (k - (nz - 1) / 2) * V]);
  }
  return out;
}
const hero = { rig: new THREE.Group(), def: new THREE.Group() };
hero.rig.add(hero.def); hero.def.position.y = -HALF;
hero.def.add(voxels(block(6, 6, 6, 0, 0, 0), M.hero, 3));
hero.eyes = [-0.12, 0.12].map((x, i) => { const g = new THREE.Group(); g.position.set(x, 0.38, 0.27); g.add(voxels(block(1, 2, 1, 0, -0.1, 0, false), M.ink, 7 + i)); hero.def.add(g); return g; });
hero.antennae = [-0.15, 0.15].map((x, i) => { const g = new THREE.Group(); g.position.set(x, 0.6, 0); g.add(voxels(block(1, 3, 1, 0, 0, 0, false), M.hero, 9 + i)); hero.def.add(g); return g; });
scene.add(hero.rig);

// Body: anticipation, stretch, ballistic arc, squash, spring back. Pure function of the frame.
function body(f) {
  const kc = (HOP.crouch[0] - 1) / (HOP.crouch[1] - 1), ks = (HOP.stretch[0] - 1) / (HOP.stretch[1] - 1), kl = (HOP.land[0] - 1) / (HOP.land[1] - 1);
